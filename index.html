<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Simple Gallery</title>
    <meta name="description" content="Responsive gallery one-page template template">
    <meta name="keywords" content="gallery, gallery template, html5 template, css3 template">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="shortcut icon" href="static/images/favicons/crocodile.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="static/images/favicons/crocodile.png">
    <link rel="apple-touch-icon-precomposed" href="static/images/favicons/crocodile.png">
    <link
        href="https://fonts.googleapis.com/css?family=PT+Sans&amp;subset=latin,cyrillic%7CPT+Serif&amp;subset=latin,cyrillic"
        rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="static/css/screen.min.css">
</head>

<body>

    <hader class="page-header">
        <div class="page-header__inner">
            <div class="page-header__group">
                <h1 class="page-header__title">Gator Built This</h1>
            </div>
        </div>
    </hader>
    <div class="page-content">
        <main class="page-content__main">
            <section class="page-content__gallery">
                <div class="gallery">
                    <div class="gallery__inner">
                        <div class="gallery__flow">
                            <div class="gallery__isle">
                                <div class="gallery__isle-inner">
                                    <div class="gallery__isle-content">
                                        <figure class="gallery__preview">
                                            <div class="gallery__preview-image"><img
                                                    src="static/images/blocks/gallery/chris-barbalis-281802.jpg"
                                                    alt="street art"></div>
                                            <figcaption class="gallery__preview-caption">
                                                <div class="gallery__preview-info">
                                                    <h2 class="gallery__preview-title">Spherical Linear Manipulator</h2>
                                                    <div class="gallery__preview-links"><a
                                                            class="gallery__preview-link gallery__preview-link_role_original"
                                                            href="https://www.youtube.com/shorts/_F_0ewRk02E">Youtube</a><a
                                                            class="gallery__preview-link gallery__preview-link_role_author"
                                                            href="https://www.instagram.com/reel/DGWs1ABTbVo/">Instagram</a><a
                                                            class="gallery__preview-link gallery__preview-link_role_photographer"
                                                            href="https://github.com/Gator-Built-This">Github Repo</a>
                                                    </div>
                                                </div>
                                            </figcaption>
                                        </figure>
                                    </div>
                                </div>
                            </div>
                            <div class="gallery__isle">
                                <div class="gallery__isle-inner">
                                    <div class="gallery__isle-content">
                                        <figure class="gallery__preview">
                                            <div class="gallery__preview-image"><img
                                                    src="static/images/blocks/gallery/ckturistando-335312.jpg"
                                                    alt="street art"></div>
                                            <figcaption class="gallery__preview-caption">
                                                <div class="gallery__preview-info">
                                                    <h2 class="gallery__preview-title">Customisable Guess Who?</h2>
                                                    <div class="gallery__preview-links"><a
                                                            class="gallery__preview-link gallery__preview-link_role_original"
                                                            href="https://www.youtube.com/@GatorBuiltThis">Youtube
                                                        </a><a
                                                            class="gallery__preview-link gallery__preview-link_role_author"
                                                            href="https://www.instagram.com/gator_built_this/">Instagram</a><a
                                                            class="gallery__preview-link gallery__preview-link_role_photographer"
                                                            href="https://github.com/Gator-Built-This/Customisable_Guess_Who">Github
                                                            Repo</a>
                                                    </div>
                                                </div>
                                            </figcaption>
                                        </figure>
                                    </div>
                                </div>
                            </div>
                            <footer class="page-footer">
                                <div class="page-footer__inner">
                                    <div class="page-footer__group">
                                        <p class="page-footer__text"><a class="page-footer__text-link"
                                                href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">More To Come
                                                </a></p>
                                    </div>
                                </div>
                            </footer>

</body>

</html>
